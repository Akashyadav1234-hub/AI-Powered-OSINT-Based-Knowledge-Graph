              // initialize global variables.

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#FF9999", "font": {"color": "black"}, "id": "APT-44", "label": "APT-44", "shape": "box", "size": 30}, {"color": "#FFCC99", "font": {"color": "black"}, "id": "CrypTox", "label": "CrypTox", "shape": "dot", "size": 10}, {"color": "#99FFFF", "font": {"color": "black"}, "id": "CVE-2026-9901", "label": "CVE-2026-9901", "shape": "dot", "size": 10}, {"color": "#CCFF99", "font": {"color": "black"}, "id": "Solar Winds", "label": "Solar Winds", "shape": "dot", "size": 10}, {"color": "#99FF99", "font": {"color": "black"}, "id": "Eastern Europe", "label": "Eastern Europe", "shape": "dot", "size": 10}, {"color": "#99FF99", "font": {"color": "black"}, "id": "North America", "label": "North America", "shape": "dot", "size": 10}]);
                  edges = new vis.DataSet([{"arrows": "to", "color": "#aaaaaa", "from": "APT-44", "label": "USES", "to": "CrypTox"}, {"arrows": "to", "color": "#aaaaaa", "from": "APT-44", "label": "EXPLOITS", "to": "CVE-2026-9901"}, {"arrows": "to", "color": "#aaaaaa", "from": "APT-44", "label": "TARGETS", "to": "Solar Winds"}, {"arrows": "to", "color": "#aaaaaa", "from": "APT-44", "label": "TARGETS", "to": "Eastern Europe"}, {"arrows": "to", "color": "#aaaaaa", "from": "APT-44", "label": "TARGETS", "to": "North America"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"layout": {"improvedLayout": true}, "physics": {"solver": "repulsion", "repulsion": {"nodeDistance": 200}}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
